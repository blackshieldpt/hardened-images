name: relock

# Daily: re-resolve the apk-native apko lockfiles and, when a Wolfi package update
# is available, commit the updated lockfile. The commit is pushed with a deploy
# key (not GITHUB_TOKEN), so it triggers the `build` workflow, which publishes the
# patched image. Net effect: patches land automatically, yet every published
# image stays reproducible from its (now-updated) commit.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read   # the push uses the deploy key, not GITHUB_TOKEN

env:
  # Keep in step with the same pin in build.yml — a lockfile resolved by one apko
  # version and then built by another is the kind of drift this repo exists to
  # avoid. (No MELANGE_VERSION: this job never runs melange, see below.)
  APKO_VERSION: 1.2.19

concurrency:
  group: relock
  cancel-in-progress: false

jobs:
  relock:
    runs-on: ubuntu-latest
    steps:
      - name: Require deploy key
        id: guard
        env:
          KEY: ${{ secrets.RELOCK_DEPLOY_KEY }}
        run: |
          if [ -n "$KEY" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else
            echo "RELOCK_DEPLOY_KEY not configured — skipping (see README)."; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.ok == 'true'
        with:
          # Write-enabled deploy key so the push triggers the build workflow.
          ssh-key: ${{ secrets.RELOCK_DEPLOY_KEY }}

      - name: Install lock tools
        if: steps.guard.outputs.ok == 'true'
        run: |
          # apko only. lock.sh returns early for every image that has a melange.yaml,
          # so `make lock-all` never invokes melange — which means melange, bubblewrap
          # and the AppArmor sysctl this job used to install were all doing nothing.
          sudo apt-get update -qq && sudo apt-get install -y -qq jq
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 \
            "https://github.com/chainguard-dev/apko/releases/download/v${APKO_VERSION}/apko_${APKO_VERSION}_linux_amd64.tar.gz" \
            | sudo tar xz -C /usr/local/bin --strip-components=1 "apko_${APKO_VERSION}_linux_amd64/apko"

      - name: Re-resolve lockfiles
        if: steps.guard.outputs.ok == 'true'
        run: make lock-all

      - name: Commit & push if changed
        if: steps.guard.outputs.ok == 'true'
        run: |
          git add images/
          if git diff --cached --quiet; then
            echo "No lockfile changes — nothing to patch."
            exit 0
          fi
          git config user.name "hardened-images relock"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: relock — pick up upstream package updates"
          git push
          echo "Pushed lockfile update; the build workflow will publish the patched image(s)."
