name: build

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  schedule:
    # Weekly: rebuild the pinned (committed-lockfile) set and re-scan it against
    # current vulnerability data. The gate fails if a pinned package is now
    # vulnerable — update with `make lock IMAGE=<name>` and commit.
    - cron: "30 5 * * 1"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write       # push images + attestations to GHCR
  id-token: write        # keyless cosign signing (Fulcio OIDC)
  attestations: write    # actions/attest-build-provenance (SLSA L3)

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - nginx
          - node
          - go
          - python
          - postgresql
          - valkey
          - clickhouse
          - nats
          - manticore
          - mailpit
          - redpanda
          - kafka
          - zookeeper
          - etcd
        variant: [prod, dev]
    env:
      SUF: ${{ matrix.variant == 'dev' && '-dev' || '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: |
          # Ubuntu 24.04 runners block unprivileged user namespaces (AppArmor),
          # which melange's bubblewrap sandbox needs. Re-enable it.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap jq
          for tool in apko melange; do
            case $tool in apko) ver=1.2.19;; melange) ver=0.54.0;; esac
            curl -sSL "https://github.com/chainguard-dev/${tool}/releases/download/v${ver}/${tool}_${ver}_linux_amd64.tar.gz" \
              | sudo tar xz -C /usr/local/bin --strip-components=1 "${tool}_${ver}_linux_amd64/${tool}"
          done
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh  | sudo sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sudo sh -s -- -b /usr/local/bin
          curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin

      - name: Install cosign
        uses: sigstore/cosign-installer@v3
        with:
          cosign-release: v2.6.1

      - run: make check-tools

      - name: Build
        run: make build IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }}

      - name: Smoke test
        run: make test IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }}

      # Prod is gated; the dev variant ships a shell + toolchain (inherently more
      # CVEs), so its scan is advisory — findings recorded, build not blocked.
      - name: Scan
        continue-on-error: ${{ matrix.variant == 'dev' }}
        run: make scan IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }}

      - name: SBOM
        run: make sbom IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }}

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.image }}-${{ matrix.variant }}
          path: reports/${{ matrix.image }}/sbom-*${{ env.SUF }}.json
          if-no-files-found: error

      # ---- Publish: push + sign + attest, only off PRs ----
      - name: Detect optional integrations
        id: cfg
        if: ${{ github.event_name != 'pull_request' }}
        env:
          MIRROR_REGISTRY: ${{ secrets.MIRROR_REGISTRY }}
          DTRACK_URL: ${{ secrets.DTRACK_URL }}
        run: |
          [ -n "$MIRROR_REGISTRY" ] && echo "mirror=true" >> "$GITHUB_OUTPUT" || echo "mirror=false" >> "$GITHUB_OUTPUT"
          [ -n "$DTRACK_URL" ] && echo "dtrack=true" >> "$GITHUB_OUTPUT" || echo "dtrack=false" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to mirror
        if: ${{ github.event_name != 'pull_request' && steps.cfg.outputs.mirror == 'true' }}
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.MIRROR_REGISTRY }}
          username: ${{ secrets.MIRROR_USERNAME }}
          password: ${{ secrets.MIRROR_PASSWORD }}

      - name: Push (GHCR + mirror)
        if: ${{ github.event_name != 'pull_request' }}
        env:
          MIRROR_REGISTRY: ${{ secrets.MIRROR_REGISTRY }}
          MIRROR_PREFIX: ${{ secrets.MIRROR_PREFIX }}
        run: make push IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }}

      - name: Keyless sign + attest SBOM/provenance (cosign)
        if: ${{ github.event_name != 'pull_request' }}
        run: make sign IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }}

      - name: Resolve pushed digest
        id: img
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          ref="$(cat reports/${{ matrix.image }}/digest${SUF}.txt)"
          echo "name=${ref%@*}"   >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      - name: SLSA build provenance (L3)
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.img.outputs.digest }}
          push-to-registry: true

      - name: Verify signature + attestations
        # Post-publish self-check. VERIFY_IGNORE_TLOG skips the Rekor query (the
        # part that stalls) — it verifies the signature + cert identity of the
        # image we just signed, no transparency-log dependency. verify.sh bounds
        # each cosign call internally (timeout on the leaf process, so a hung
        # fetch is actually killed); non-blocking — consumers verify with the
        # tlog (README).
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          VERIFY_IGNORE_TLOG: "1"
        run: |
          make verify IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }} \
            || echo "::warning::post-publish verify failed or timed out (image is already signed)"

      - name: Upload SBOM to Dependency-Track
        if: ${{ github.event_name != 'pull_request' && steps.cfg.outputs.dtrack == 'true' }}
        env:
          DTRACK_URL: ${{ secrets.DTRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
        run: make upload-sbom IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }}
