name: build

on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  push:
    # auto-update/** is how the bump branches get a build at all. The PR that
    # check-updates opens is created with GITHUB_TOKEN, and GitHub does not start
    # workflow runs for its own token's events — those runs sit at
    # `action_required` forever, which is why four bump PRs reached this repo
    # unverified. The branch push uses the deploy key, so it does trigger.
    # Nothing publishes from these branches; see PUBLISH below.
    branches: [main, 'auto-update/**']
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  schedule:
    # Weekly: rebuild the pinned (committed-lockfile) set and re-scan it against
    # current vulnerability data. The gate fails if a pinned package is now
    # vulnerable — update with `make lock IMAGE=<name>` and commit.
    - cron: "30 5 * * 1"
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write       # push images + attestations to GHCR
  id-token: write        # keyless cosign signing (Fulcio OIDC)
  attestations: write    # actions/attest-build-provenance (SLSA L3)

env:
  # Publish only from main. Every push-triggered run builds, smoke-tests and
  # scans; only main's also pushes, signs and attests. Before auto-update/**
  # could trigger this workflow, "not a pull_request" was the same thing as
  # "main" — it is not any more, and getting this wrong would publish an image
  # from an unreviewed bump branch.
  PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}

  # Every tool is pinned. syft/grype/trivy used to install whatever `main` served
  # at the moment each job ran, which meant CI silently drifted and could differ
  # from what developers run locally — a stale local grype is how a Critical in
  # manticore got missed outside CI. Bump these deliberately, in a reviewable diff.
  #
  # Pinning the scanner *binaries* does not stale the scan: grype and trivy still
  # fetch their vulnerability databases fresh on every run. Only the code is fixed.
  APKO_VERSION: 1.2.19
  MELANGE_VERSION: 0.54.0
  SYFT_VERSION: 1.50.0
  GRYPE_VERSION: 0.116.0
  TRIVY_VERSION: 0.72.0
  COSIGN_VERSION: 2.6.1

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - nginx
          - nginx-acme
          - node
          - node24
          - go
          - python
          - python-sodium
          - postgresql
          - valkey
          - minio
          - clickhouse
          - nats
          - openbao
          - manticore
          - mailpit
          - redpanda
          - kafka
          - zookeeper
          - etcd
          - versitygw
          - static
        variant: [prod, dev]
    env:
      SUF: ${{ matrix.variant == 'dev' && '-dev' || '' }}
    steps:
      - uses: actions/checkout@v5

      # Keyed on the exact pinned versions, with no restore-keys on purpose: a
      # partial restore would leave an older binary in place and the install step
      # below would skip re-downloading it, silently running the wrong version.
      - name: Cache build tools
        uses: actions/cache@v4
        with:
          path: ~/.cache/hardened-images-tools
          key: tools-${{ runner.os }}-apko${{ env.APKO_VERSION }}-melange${{ env.MELANGE_VERSION }}-syft${{ env.SYFT_VERSION }}-grype${{ env.GRYPE_VERSION }}-trivy${{ env.TRIVY_VERSION }}-cosign${{ env.COSIGN_VERSION }}

      - name: Install build tools
        run: |
          # Ubuntu 24.04 runners block unprivileged user namespaces (AppArmor),
          # which melange's bubblewrap sandbox needs. Re-enable it.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

          # Retried and then verified. This step once reported success while
          # bubblewrap was simply not installed, and the run failed two steps later
          # with an opaque "bwrap not found" from check-tools. apt can end up in
          # that state after a transient mirror failure, and -qq hides the warning
          # that would have said so. Verifying here fails at the cause instead.
          for attempt in 1 2 3; do
            sudo apt-get update -qq && sudo apt-get install -y -qq bubblewrap jq && break
            echo "::warning::apt attempt ${attempt} failed; retrying"
            sleep $((attempt * 5))
          done

          # Tools live in a cached directory on PATH rather than /usr/local/bin,
          # so a warm cache needs no network at all. This matrix runs 38 jobs and
          # each used to fetch five tools independently — ~190 unpinned downloads
          # per run, any one of which could fail the job it belonged to. That is
          # exactly how a `trivy not found` error failed a build whose code was
          # fine. Downloads now retry, and on a warm cache there are none.
          TOOLBIN="$HOME/.cache/hardened-images-tools"
          mkdir -p "$TOOLBIN"
          echo "$TOOLBIN" >> "$GITHUB_PATH"

          get() { curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 "$@"; }

          for tool in apko melange; do
            case $tool in
              apko)    ver="$APKO_VERSION" ;;
              melange) ver="$MELANGE_VERSION" ;;
            esac
            if [ ! -x "$TOOLBIN/$tool" ]; then
              get "https://github.com/chainguard-dev/${tool}/releases/download/v${ver}/${tool}_${ver}_linux_amd64.tar.gz" \
                | tar xz -C "$TOOLBIN" --strip-components=1 "${tool}_${ver}_linux_amd64/${tool}"
            fi
          done

          if [ ! -x "$TOOLBIN/syft" ]; then
            get https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b "$TOOLBIN" "v${SYFT_VERSION}"
          fi
          if [ ! -x "$TOOLBIN/grype" ]; then
            get https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b "$TOOLBIN" "v${GRYPE_VERSION}"
          fi
          if [ ! -x "$TOOLBIN/trivy" ]; then
            get https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b "$TOOLBIN" "v${TRIVY_VERSION}"
          fi
          # cosign was installed by sigstore/cosign-installer, whose download flaked
          # three times in one day. Fetching it like every other tool puts it behind
          # the same retry and the same cache, so a warm cache needs no network at all.
          if [ ! -x "$TOOLBIN/cosign" ]; then
            get -o "$TOOLBIN/cosign" \
              "https://github.com/sigstore/cosign/releases/download/v${COSIGN_VERSION}/cosign-linux-amd64"
            chmod +x "$TOOLBIN/cosign"
          fi

          # Fail loudly here rather than mid-scan if a pin and a binary disagree, or
          # if an install quietly did nothing. Anchored with -F so the dots in a
          # version are not regex wildcards.
          command -v bwrap >/dev/null || { echo "::error::bubblewrap missing after apt install"; exit 1; }
          command -v jq    >/dev/null || { echo "::error::jq missing after apt install"; exit 1; }
          "$TOOLBIN/apko"   version 2>&1 | grep -qF "${APKO_VERSION}"
          "$TOOLBIN/melange" version 2>&1 | grep -qF "${MELANGE_VERSION}"
          "$TOOLBIN/grype"  version | grep -qF "${GRYPE_VERSION}"
          "$TOOLBIN/trivy" --version | grep -qF "${TRIVY_VERSION}"
          "$TOOLBIN/syft"   version | grep -qF "${SYFT_VERSION}"
          "$TOOLBIN/cosign" version 2>&1 | grep -qF "${COSIGN_VERSION}"

      - run: make check-tools

      - name: Build
        run: make build IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }}

      - name: Smoke test
        run: make test IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }}

      # Prod is gated; the dev variant ships a shell + toolchain (inherently more
      # CVEs), so its scan is advisory — findings recorded, build not blocked.
      - name: Scan
        continue-on-error: ${{ matrix.variant == 'dev' }}
        run: make scan IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }}

      - name: SBOM
        run: make sbom IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }}

      - name: Upload SBOM artifacts
        uses: actions/upload-artifact@v6
        with:
          name: sbom-${{ matrix.image }}-${{ matrix.variant }}
          path: reports/${{ matrix.image }}/sbom-*${{ env.SUF }}.json
          if-no-files-found: error

      # ---- Publish: push + sign + attest, only off PRs ----
      - name: Detect optional integrations
        id: cfg
        if: ${{ env.PUBLISH == 'true' }}
        env:
          MIRROR_REGISTRY: ${{ secrets.MIRROR_REGISTRY }}
          DTRACK_URL: ${{ secrets.DTRACK_URL }}
        run: |
          [ -n "$MIRROR_REGISTRY" ] && echo "mirror=true" >> "$GITHUB_OUTPUT" || echo "mirror=false" >> "$GITHUB_OUTPUT"
          [ -n "$DTRACK_URL" ] && echo "dtrack=true" >> "$GITHUB_OUTPUT" || echo "dtrack=false" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: ${{ env.PUBLISH == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to mirror
        if: ${{ env.PUBLISH == 'true' && steps.cfg.outputs.mirror == 'true' }}
        uses: docker/login-action@v4
        with:
          registry: ${{ secrets.MIRROR_REGISTRY }}
          username: ${{ secrets.MIRROR_USERNAME }}
          password: ${{ secrets.MIRROR_PASSWORD }}

      - name: Push (GHCR + mirror)
        if: ${{ env.PUBLISH == 'true' }}
        env:
          MIRROR_REGISTRY: ${{ secrets.MIRROR_REGISTRY }}
          MIRROR_PREFIX: ${{ secrets.MIRROR_PREFIX }}
        run: make push IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }}

      - name: Keyless sign + attest SBOM/provenance (cosign)
        if: ${{ env.PUBLISH == 'true' }}
        run: make sign IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }}

      - name: Resolve pushed digest
        id: img
        if: ${{ env.PUBLISH == 'true' }}
        run: |
          ref="$(cat reports/${{ matrix.image }}/digest${SUF}.txt)"
          echo "name=${ref%@*}"   >> "$GITHUB_OUTPUT"
          echo "digest=${ref#*@}" >> "$GITHUB_OUTPUT"

      - name: SLSA build provenance (L3)
        if: ${{ env.PUBLISH == 'true' }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-name: ${{ steps.img.outputs.name }}
          subject-digest: ${{ steps.img.outputs.digest }}
          push-to-registry: true

      - name: Verify signature + attestations
        # Post-publish self-check. VERIFY_IGNORE_TLOG skips the Rekor query (the
        # part that stalls) — it verifies the signature + cert identity of the
        # image we just signed, no transparency-log dependency. verify.sh bounds
        # each cosign call internally (timeout on the leaf process, so a hung
        # fetch is actually killed); non-blocking — consumers verify with the
        # tlog (README).
        if: ${{ env.PUBLISH == 'true' }}
        continue-on-error: true
        env:
          VERIFY_IGNORE_TLOG: "1"
        run: |
          make verify IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }} \
            || echo "::warning::post-publish verify failed or timed out (image is already signed)"

      - name: Upload SBOM to Dependency-Track
        if: ${{ env.PUBLISH == 'true' && steps.cfg.outputs.dtrack == 'true' }}
        env:
          DTRACK_URL: ${{ secrets.DTRACK_URL }}
          DTRACK_API_KEY: ${{ secrets.DTRACK_API_KEY }}
        run: make upload-sbom IMAGE=${{ matrix.image }} VARIANT=${{ matrix.variant }}

  # A red X on a scheduled build reads as "CI is broken" and gets ignored. It is
  # not: the scan gate runs BEFORE the push, so a failing job means that image
  # stopped publishing and its tag is quietly frozen at the last good build.
  # versitygw and zookeeper sat like that for three days — the signal existed the
  # whole time and looked like noise. This turns it into an issue that names the
  # images, and updates the same issue rather than opening one per run.
  report-failure:
    needs: build
    if: ${{ failure() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      actions: read
    steps:
      - name: Open or update the build-failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="build: main is failing"

          # Name the images, not just the run. "3 jobs failed" sends someone to the
          # Actions tab; "versitygw (prod), zookeeper (prod)" is already the answer.
          failed="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/jobs" \
            --paginate -q '.jobs[] | select(.conclusion=="failure") | .name' | sort | sed 's/^/- /')"
          [ -n "$failed" ] || failed="- (no failed job reported; the run itself failed)"

          body="$(printf '%s\n\n%s\n\n%s\n\n%s\n' \
            "Run: ${RUN_URL}" \
            "Failing jobs:" \
            "${failed}" \
            "The scan gate runs before the push, so each failing image is **not publishing** — its tags stay frozen at the last good build until this is fixed. Check which step failed: a \`Scan\` failure is a real finding needing a bump or a justified waiver, while a failure in \`Keyless sign\` or later is usually transient and a re-run clears it.")"

          # No `| head -1`: this runs under pipefail, and head exiting early
          # SIGPIPEs gh, which would fail the step on the success path. jq picks
          # the first match instead.
          existing="$(gh issue list --state open --search "\"${TITLE}\" in:title" \
            --json number,title \
            --jq "[.[] | select(.title == \"${TITLE}\") | .number] | first // empty")"

          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
            echo "Updated issue #${existing}"
          else
            gh issue create --title "$TITLE" --body "$body"
          fi
