# Hardened Go (apko) — Wolfi go-1.26, non-root.
# Keeps a shell: the go-1.26 package depends on bash (auto-dep).
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - go-1.26
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/go

work-dir: /app

environment:
  GOPATH: /app/go
  GOBIN: /app/bin
  PATH: /usr/bin:/bin:/app/bin
  CGO_ENABLED: "0"

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: go
  org.opencontainers.image.description: Hardened Go 1.26 built on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: BSD-3-Clause

archs:
  - x86_64
