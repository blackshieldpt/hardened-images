# Repackages the hermetic Redpanda broker (/opt/redpanda) from the upstream deb,
# plus rpk from the upstream GitHub release, plus the hardened entrypoint + config.
# The broker bundles its own loader/libs under /opt/redpanda/lib, so no Wolfi libs
# are needed for it. entrypoint.sh/redpanda.yaml are read from images/redpanda via --source-dir.
package:
  name: redpanda-hardened
  version: 26.1.9
  epoch: 1
  description: "Redpanda streaming data platform (broker repackaged, rpk from source)"
  copyright:
    - license: BUSL-1.1
  options:
    no-provides: true
    no-depends: true

vars:
  token: nzc4ZYQK3WRGd9sy
  deb_sha256: 4acb940cdf93fcfd3e9e3d40c8d18ccc784a97d2caa649f96710388a09bbdc51

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - binutils
      - go
      - git

pipeline:
  - runs: |
      curl -fsSL --retry 5 --retry-all-errors \
        "https://dl.redpanda.com/${{vars.token}}/redpanda/deb/ubuntu/pool/any-version/main/r/re/redpanda_${{package.version}}-1/redpanda_${{package.version}}-1_amd64.deb" \
        -o redpanda.deb
      echo "${{vars.deb_sha256}}  redpanda.deb" | sha256sum -c -
      ar x redpanda.deb
      tar xf data.tar.*
      mkdir -p "${{targets.destdir}}/opt"
      cp -a opt/redpanda "${{targets.destdir}}/opt/redpanda"
      mkdir -p "${{targets.destdir}}/usr/bin"
      ln -s /opt/redpanda/bin/redpanda "${{targets.destdir}}/usr/bin/redpanda"
  - name: Build rpk from source with patched Go deps
    runs: |
      # The C++ broker is repackaged from the deb above; rpk is the Go CLI that
      # carried the GO-2026 x/crypto/x/net criticals, so rebuild just it from
      # source (sparse checkout of src/go/rpk) with the deps bumped.
      git init rpk-src && cd rpk-src
      git remote add origin https://github.com/redpanda-data/redpanda.git
      git sparse-checkout init --cone
      git sparse-checkout set src/go/rpk
      git fetch --depth 1 origin v${{package.version}}
      git checkout FETCH_HEAD
      cd src/go/rpk
      go get golang.org/x/crypto@v0.52.0 golang.org/x/net@v0.55.0
      go mod tidy
      VER=github.com/redpanda-data/redpanda/src/go/rpk/pkg/cli/version
      CONT=github.com/redpanda-data/redpanda/src/go/rpk/pkg/cli/container/containerutil
      CGO_ENABLED=0 go build \
        -ldflags "-s -w -X ${VER}.version=v${{package.version}} -X ${VER}.rev=988a61b -X ${CONT}.tag=v${{package.version}}" \
        -o rpk ./cmd/rpk
      install -Dm0755 rpk "${{targets.destdir}}/usr/bin/rpk"
  - runs: |
      install -Dm0755 entrypoint.sh "${{targets.destdir}}/usr/local/bin/entrypoint.sh"
      install -Dm0644 redpanda.yaml "${{targets.destdir}}/etc/redpanda/redpanda.yaml"

update:
  enabled: true
  github:
    identifier: redpanda-data/redpanda
    use-tag: true
    strip-prefix: "v"
