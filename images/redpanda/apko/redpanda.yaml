# Hardened Redpanda (apko) — upstream broker + rpk repackaged via melange.
# Keeps busybox + bash: the entrypoint bootstraps the SASL superuser via a shell
# script (sed/hostname/rpk), and the broker launcher is a bash wrapper.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - busybox
    - bash
    - redpanda-hardened
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: redpanda
      gid: 65532
  users:
    - username: redpanda
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/local/bin/entrypoint.sh

environment:
  PATH: /opt/redpanda/bin:/usr/bin:/bin

paths:
  - path: /var/lib/redpanda
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/redpanda/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /etc/redpanda
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: redpanda
  org.opencontainers.image.description: Hardened Redpanda streaming platform on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: BUSL-1.1

archs:
  - x86_64
