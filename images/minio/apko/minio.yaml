# Hardened MinIO (apko) — Wolfi minio + mc, shell-less, non-root.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - minio
    - mc
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: minio
      gid: 65532
  users:
    - username: minio
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/minio
cmd: server /data --console-address :9001

work-dir: /data

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: minio
  org.opencontainers.image.description: Hardened shell-less MinIO object storage built on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: AGPL-3.0-or-later

archs:
  - x86_64
