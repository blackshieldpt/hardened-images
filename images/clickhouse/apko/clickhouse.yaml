# Hardened ClickHouse (apko) — upstream static binary repackaged via melange, shell-less, non-root.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - clickhouse-hardened
    - glibc
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: clickhouse
      gid: 65532
  users:
    - username: clickhouse
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/clickhouse-server --config-file=/etc/clickhouse-server/config.xml

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /var/lib/clickhouse
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/clickhouse/tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/clickhouse/user_files
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/clickhouse/format_schemas
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/log/clickhouse-server
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: clickhouse
  org.opencontainers.image.description: Hardened shell-less ClickHouse server on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: Apache-2.0

archs:
  - x86_64
