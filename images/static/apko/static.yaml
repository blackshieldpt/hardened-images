# Hardened static (apko) — the minimal runtime base, non-root.
#
# Contains a filesystem skeleton and a CA trust store, and nothing else: no
# shell, no libc beyond the baselayout, no package manager, no interpreter, no
# toolchain. It is not runnable on its own (no entrypoint) and is not meant to
# be; it exists to be the FROM line under a statically linked binary.
#
# Use it for CGO_ENABLED=0 Go, Rust musl-static, or any other self-contained
# executable. Anything that dynamically links libc needs a base with one --
# `glibc-dynamic` is not here on purpose, since carrying it would make this
# image a worse version of a real runtime rather than a floor.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

# /app, owned by the runtime user, so a consumer's `COPY --chown=65532:65532`
# lands somewhere that already exists with the right ownership. A WORKDIR Docker
# has to create itself is made root-owned, which a UID 65532 process then cannot
# write to -- the failure this pre-creates away.
work-dir: /app

paths:
  - path: /app
    type: directory
    permissions: 0o755
    uid: 65532
    gid: 65532
