# Hardened OpenBao (apko) — Wolfi openbao + hardened config, shell-less, non-root.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - openbao
    - openbao-config
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: openbao
      gid: 65532
  users:
    - username: openbao
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/bao
cmd: server -config=/etc/openbao/openbao.hcl

environment:
  PATH: /usr/bin:/bin
  # Lets the `bao` CLI reach the local server via `docker exec … bao …`.
  BAO_ADDR: http://127.0.0.1:8200

paths:
  - path: /openbao
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /openbao/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: openbao
  org.opencontainers.image.description: Hardened shell-less OpenBao (Vault-compatible secrets manager) on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: MPL-2.0

archs:
  - x86_64
