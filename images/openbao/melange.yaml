# Ships the hardened OpenBao config as an apk for apko to install.
# The bao binary comes from the Wolfi `openbao` package (CVE-patched).
# openbao.hcl is read from images/openbao via --source-dir.
package:
  name: openbao-config
  version: "1.0.0"
  epoch: 0
  description: "Hardened OpenBao single-node config"
  copyright:
    - license: MPL-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox

pipeline:
  - runs: |
      install -Dm0644 openbao.hcl "${{targets.destdir}}/etc/openbao/openbao.hcl"
