# Hardened Valkey (apko) — Wolfi valkey-8.1, shell-less, non-root.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - valkey-8.1
    - valkey-8.1-cli
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: valkey
      gid: 65532
  users:
    - username: valkey
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/valkey-server

work-dir: /data

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: valkey
  org.opencontainers.image.description: Hardened shell-less Valkey 8.1 built on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: BSD-3-Clause

archs:
  - x86_64
