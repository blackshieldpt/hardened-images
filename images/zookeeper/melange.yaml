# Ships zoo.cfg into the Wolfi zookeeper-3.9 conf dir (the default ZOOCFGDIR).
# Read from images/zookeeper via --source-dir. No update block: version from config.env.
package:
  name: zookeeper-config
  version: "1.0.0"
  epoch: 0
  description: "Hardened ZooKeeper standalone config"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox

pipeline:
  - runs: |
      install -Dm0644 zoo.cfg "${{targets.destdir}}/usr/share/java/zookeeper/conf/zoo.cfg"
