# Hardened ZooKeeper (apko) — Wolfi zookeeper-3.9, bash + openjdk-17 (auto-dep).
# Keeps bash/busybox: zkServer.sh and friends are shell scripts.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - busybox
    - zookeeper-3.9
    - zookeeper-config
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: zookeeper
      gid: 65532
  users:
    - username: zookeeper
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/share/java/zookeeper/bin/zkServer.sh
cmd: start-foreground

environment:
  PATH: /usr/share/java/zookeeper/bin:/usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/default-jvm
  ZOO_LOG_DIR: /var/lib/zookeeper/logs

paths:
  - path: /var/lib/zookeeper
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/zookeeper/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/zookeeper/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: zookeeper
  org.opencontainers.image.description: Hardened Apache ZooKeeper on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: Apache-2.0

archs:
  - x86_64
