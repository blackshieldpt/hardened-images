# Hardened ZooKeeper (apko) — zookeeper-hardened, built from source by melange.yaml
# because Wolfi's zookeeper-3.9 stopped being rebuilt and its CVE fixes were never
# published. Keeps bash/busybox: zkServer.sh and friends are shell scripts.
#
# The JRE and the shell utilities used to arrive as auto-deps of the Wolfi package,
# so they are declared here now that it is gone.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - busybox
    - bash
    - grep
    - sed
    - procps
    # default-jvm is the load-bearing one: it provides the /usr/lib/jvm/default-jvm
    # symlink that JAVA_HOME below points at, and it depends on openjdk-17-jre.
    # Without it the JRE lands in java-17-openjdk/ and zkEnv.sh cannot find java.
    # The JRE is listed too, redundantly but explicitly, since it is the runtime.
    - openjdk-17-jre
    - openjdk-17-default-jvm
    - zookeeper-hardened
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: zookeeper
      gid: 65532
  users:
    - username: zookeeper
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/share/java/zookeeper/bin/zkServer.sh
cmd: start-foreground

environment:
  PATH: /usr/share/java/zookeeper/bin:/usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/default-jvm
  ZOO_LOG_DIR: /var/lib/zookeeper/logs

paths:
  - path: /var/lib/zookeeper
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/zookeeper/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/zookeeper/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: zookeeper
  org.opencontainers.image.description: Hardened Apache ZooKeeper on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: Apache-2.0

archs:
  - x86_64
