# Builds OpenBao 2.7 from source and ships a raft-backed hardened config. A
# separate image from `openbao` (2.6) because 2.7 removed the `file` storage
# backend that image's config uses: moving an existing deployment means migrating
# its data (`bao operator migrate` from file to raft), which is the operator's
# call, not something a tag bump should do to them. New deployments start here.
#
# Pure Go, CGO disabled, so the result is static and its module graph stays visible
# to grype/trivy. openbao.hcl is read from images/openbao27 via --source-dir.
#
# The package name differs from openbao's on purpose: both land in the shared
# ./packages repo, and apko would otherwise install whichever version is newest
# into either image.
package:
  name: openbao27-hardened
  version: 2.7.1
  epoch: 0
  description: "OpenBao secrets manager (built from source) + hardened config"
  copyright:
    - license: MPL-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go
      - git

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/openbao/openbao
      tag: v${{package.version}}
      expected-commit: a5db72cef75c24b920ade02065b18dd8eb666bac
  - name: Bump vulnerable Go dependencies
    runs: |
      # Carried over from the 2.6 image as floors. 2.7.1 already ships grpc
      # v1.83.2 (fixes GHSA-hrxh-6v49-42gf, GHSA-vp52-pcj8-j9qc, GHSA-2v4p-qf9q-27wj)
      # and go-archive/otel/go-ntlmssp at the pinned versions, so today these move
      # only grpc. 2.7 moved cel-go to cel.dev/cel-go (v0.32.0 in 2.7.1), so the
      # github.com/google/cel-go pin no longer applies and is dropped.
      # openbao is a single module, so a bump here does not desynchronise siblings.
      #
      # These pins go stale silently — a version that was clean when written stops
      # being clean without anything here changing. They are floor pins, not
      # ceilings: raise them whenever the scan reports the pinned version.
      GOFLAGS=-mod=mod go get \
        google.golang.org/grpc@v1.84.0 \
        github.com/moby/go-archive@v0.3.0 \
        go.opentelemetry.io/otel/sdk@v1.45.0 \
        github.com/Azure/go-ntlmssp@v0.1.1
      go mod tidy
  - name: Compile the bao binary
    runs: |
      # Mirrors upstream scripts/build.sh, minus the `ui` build tag: that embeds the
      # web UI, which needs a Node toolchain to generate and is surface this image
      # has no use for. The server runs identically without it.
      # fullVersion is a package-private var upstream fills via goreleaser, so it
      # has to be injected or `bao version` reports the 2.0.0-HEAD placeholder.
      REV="$(git rev-parse HEAD)"
      CGO_ENABLED=0 go build -trimpath -tags openbao \
        -ldflags "-s -w \
          -X github.com/openbao/openbao/v2/internal/version.fullVersion=${{package.version}} \
          -X github.com/openbao/openbao/v2/internal/version.GitCommit=${REV}" \
        -o "${{targets.destdir}}/usr/bin/bao" .
  - runs: |
      install -Dm0644 openbao.hcl "${{targets.destdir}}/etc/openbao/openbao.hcl"
  - name: Verify the binary reports the version we claim
    runs: |
      "${{targets.destdir}}/usr/bin/bao" version | grep -q "${{package.version}}"

update:
  enabled: true
  github:
    identifier: openbao/openbao
    use-tag: true
    tag-filter: "v2.7."
    strip-prefix: "v"
