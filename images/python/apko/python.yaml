# Hardened Python (apko) — Wolfi python-3.14, shell-less, non-root.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - python-3.14
    - py3.14-pip
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/python3.14

work-dir: /app

environment:
  PATH: /usr/bin:/bin
  LANG: C.UTF-8
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUNBUFFERED: "1"

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: python
  org.opencontainers.image.description: Hardened shell-less Python 3.14 built on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: PSF-2.0

archs:
  - x86_64
