# Hardened Node.js (apko) — Wolfi nodejs-24, shell-less, non-root.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - nodejs-24
    - npm
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nonroot
      gid: 65532
  users:
    - username: nonroot
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/node

work-dir: /app

environment:
  PATH: /usr/bin:/bin
  NODE_ENV: production

paths:
  - path: /app
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: node24
  org.opencontainers.image.description: Hardened shell-less Node.js 24 built on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: MIT

archs:
  - x86_64
