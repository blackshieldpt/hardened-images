# Hardened VersityGW (apko) — versitygw built from source via melange, shell-less, non-root.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - versitygw-hardened
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: versitygw
      gid: 65532
  users:
    - username: versitygw
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/versitygw
# POSIX backend serving /data as S3, with a health endpoint for container probes.
# Supply ROOT_ACCESS_KEY / ROOT_SECRET_KEY at runtime for the admin credentials.
cmd: --health /_health posix /data

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: versitygw
  org.opencontainers.image.description: Hardened shell-less Versity S3 Gateway built on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: Apache-2.0

archs:
  - x86_64
