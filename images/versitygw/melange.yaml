# Builds versitygw from source (versitygw isn't in Wolfi). Pure-Go, CGO disabled,
# so the result is a static binary. v1.7.0 carries current x/crypto (v0.54.0),
# x/net (v0.57.0) and x/text (v0.40.0), so it needs no dependency overrides — the
# x/text bump v1.6.0 required for GO-2026-5970 is gone, and reinstating it would
# now downgrade the module.
package:
  name: versitygw-hardened
  version: 1.7.0
  epoch: 0
  description: "Versity S3 Gateway (built from source)"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go
      - git

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/versity/versitygw
      tag: v${{package.version}}
      expected-commit: 8a3dbcf97d996ea4955426e6b8a76eb96d2cd92a
  - name: Compile static binary
    runs: |
      CGO_ENABLED=0 go build \
        -ldflags "-s -w -X=main.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/versitygw" ./cmd/versitygw
  - runs: |
      "${{targets.destdir}}/usr/bin/versitygw" --version

update:
  enabled: true
  github:
    identifier: versity/versitygw
    use-tag: true
    tag-filter: "v"
    strip-prefix: "v"
