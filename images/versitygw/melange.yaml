# Builds versitygw from source (versitygw isn't in Wolfi). Pure-Go, CGO disabled,
# so the result is a static binary. v1.9.0 carries x/net v0.60.0, already past
# GO-2026-6612 (Critical, HTTP/2 flow control, fixed in 0.60.0). x/net is still
# raised to v0.61.0 below, which brings x/crypto to v0.58.0 and x/text to v0.43.0,
# matching the other Go images. Nothing else needs an override.
#
# The 1.7.0 -> 1.8.0 bump is also the fix for amqp091-go: 1.7.0 pinned v1.12.0,
# which carries 3 Critical and 7 High advisories, all fixed in 1.13.0. 1.9.0
# pins v1.15.0.
package:
  name: versitygw-hardened
  version: 1.10.0
  epoch: 0
  description: "Versity S3 Gateway (built from source)"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go
      - git

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/versity/versitygw
      tag: v${{package.version}}
      expected-commit: 72f75bd0f4c67a7663d3c56b80f05a44f6732db8
  - name: Bump vulnerable Go dependencies
    runs: |
      # GO-2026-6612 is fixed in x/net 0.60.0. A floor pin, not a ceiling: raise it
      # whenever the scan names this version, and drop the step once upstream's
      # go.mod is past it.
      go get golang.org/x/net@v0.61.0
      go mod tidy
  - name: Compile static binary
    runs: |
      CGO_ENABLED=0 go build \
        -ldflags "-s -w -X=main.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/versitygw" ./cmd/versitygw
  - runs: |
      "${{targets.destdir}}/usr/bin/versitygw" --version

update:
  enabled: true
  github:
    identifier: versity/versitygw
    use-tag: true
    tag-filter: "v"
    strip-prefix: "v"
