# Builds etcd from source instead of installing Wolfi's etcd-3.6.
#
# Wolfi's etcd-3.6 has not been rebuilt since 2026-06-03 and is capped at
# 3.6.12-r1, while its advisory data names fixes in 3.6.13-r1 and 3.6.14-r0 that
# were never published to the public repo. Building here gets 3.6.14 and, just as
# importantly, links against Wolfi's current Go toolchain — the High findings on
# the apk build were Go stdlib (go1.25.11; fixed in 1.25.12/1.26.5).
#
# Pure Go, CGO disabled, so the result is static and its module graph stays
# visible to grype/trivy — unlike the repackaged-binary images, where vendored
# code is invisible to both.
package:
  name: etcd-hardened
  version: 3.6.14
  epoch: 0
  description: "etcd distributed key-value store (built from source)"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go
      - git

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/etcd-io/etcd
      tag: v${{package.version}}
      expected-commit: fc04cf702b0a46c2fd85547a2be05705b100a496
  # No dependency bumping here, unlike mailpit/versitygw. etcd is a multi-module
  # repo where etcdctl and etcdutl require server via replace directives, so
  # bumping a dep in server alone makes their go.mod inconsistent and the build
  # fails with "updates to go.mod needed". The only finding left after moving to
  # source is GO-2026-5158 in otel (Medium, risk 0.1); chasing it across three
  # modules on every bump costs more than it buys.
  - name: Build etcd, etcdctl and etcdutl
    runs: |
      # Three separate Go modules, mirroring upstream scripts/build_lib.sh. The
      # only injected symbol upstream sets is the git SHA; the version string is a
      # constant in api/v3/version, so it tracks the checked-out tag on its own.
      REV="$(git rev-parse --short HEAD)"
      LDFLAGS="-s -w -X=go.etcd.io/etcd/api/v3/version.GitSHA=${REV}"
      for mod in server:etcd etcdctl:etcdctl etcdutl:etcdutl; do
        dir="${mod%%:*}"; bin="${mod##*:}"
        ( cd "$dir" && CGO_ENABLED=0 go build -trimpath -ldflags "$LDFLAGS" \
            -o "${{targets.destdir}}/usr/bin/${bin}" . )
      done
  - name: Verify the binaries report the version we claim
    runs: |
      # Guards against a bump that changes package.version without moving the tag.
      "${{targets.destdir}}/usr/bin/etcd" --version | grep -q "etcd Version: ${{package.version}}"
      "${{targets.destdir}}/usr/bin/etcdctl" version | grep -q "etcdctl version: ${{package.version}}"
      "${{targets.destdir}}/usr/bin/etcdutl" version | grep -q "etcdutl version: ${{package.version}}"

update:
  enabled: true
  github:
    identifier: etcd-io/etcd
    use-tag: true
    tag-filter: "v3.6."
    strip-prefix: "v"
