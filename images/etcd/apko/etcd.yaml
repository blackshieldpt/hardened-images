# Hardened etcd (apko) — Wolfi etcd-3.6, shell-less, non-root.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - etcd-3.6
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: etcd
      gid: 65532
  users:
    - username: etcd
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/etcd

environment:
  PATH: /usr/bin:/bin
  ETCD_DATA_DIR: /var/lib/etcd
  ETCD_LISTEN_CLIENT_URLS: http://0.0.0.0:2379
  ETCD_ADVERTISE_CLIENT_URLS: http://127.0.0.1:2379

paths:
  - path: /var/lib/etcd
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700

annotations:
  org.opencontainers.image.title: etcd
  org.opencontainers.image.description: Hardened shell-less etcd key-value store on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: Apache-2.0

archs:
  - x86_64
