# Hardened PostgreSQL (apko) — Wolfi postgresql-18.
# Keeps busybox: the entrypoint (POSTGRES_PASSWORD + initdb.d) is a /bin/sh script
# shipped via the postgresql-entrypoint melange package (--repository-append ./packages).
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - busybox
    - postgresql-18
    - postgresql-18-client
    - postgresql-18-contrib
    - su-exec
    - postgresql-entrypoint
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: postgres
      gid: 65532
  users:
    - username: postgres
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/local/bin/entrypoint.sh
cmd: postgres

environment:
  PGDATA: /var/lib/postgresql/data
  LANG: C.UTF-8
  PATH: /usr/libexec/postgresql18:/usr/lib/postgresql18/bin:/usr/bin:/bin

paths:
  - path: /var/lib/postgresql
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/postgresql/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /run/postgresql
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: postgresql
  org.opencontainers.image.description: Hardened PostgreSQL 18 built on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: PostgreSQL

archs:
  - x86_64
