# Hardened nginx (apko) — Wolfi nginx-stable, shell-less, non-root.
# Replaces the previous Dockerfile build. Version pinned via config.env apk constraint.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - nginx-stable
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nginx
      gid: 65532
  users:
    - username: nginx
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/sbin/nginx -g "daemon off; pid /run/nginx/nginx.pid;"

environment:
  PATH: /usr/sbin:/usr/bin:/bin

paths:
  - path: /var/lib/nginx
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/client_body_temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/proxy_temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/fastcgi_temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/uwsgi_temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/scgi_temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/log/nginx
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /run/nginx
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: nginx
  org.opencontainers.image.description: Hardened shell-less nginx built on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: BSD-2-Clause

archs:
  - x86_64
