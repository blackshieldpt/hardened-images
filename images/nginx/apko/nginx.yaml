# Hardened nginx (apko) — Wolfi nginx-stable, non-root.
# Keeps busybox + gettext: the entrypoint (runtime envsubst templating) is a
# /bin/sh script shipped via the nginx-entrypoint melange package.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - busybox
    - gettext
    - nginx-stable
    - nginx-entrypoint
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nginx
      gid: 65532
  users:
    - username: nginx
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/local/bin/docker-entrypoint.sh

environment:
  PATH: /usr/sbin:/usr/bin:/bin

paths:
  # The entrypoint renders templates into here at boot, so it must be writable
  # by the run-as user. /etc/nginx/templates (read-only) is shipped by the package.
  - path: /etc/nginx/conf.d
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/client_body_temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/proxy_temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/fastcgi_temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/uwsgi_temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/scgi_temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/log/nginx
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /run/nginx
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: nginx
  org.opencontainers.image.description: Hardened shell-less nginx built on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: BSD-2-Clause

archs:
  - x86_64
