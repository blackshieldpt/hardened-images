# Hardened nginx WITH ACME (apko) — Wolfi nginx-mainline plus lego, non-root.
#
# Deliberately a separate image from `nginx`: lego adds ~40 MB and 206 Go modules
# to the SBOM and the vulnerability scan, which consumers terminating TLS
# elsewhere should not carry. Track images/nginx/apko/nginx.yaml when its package
# set or paths change — this file is a copy of it plus the ACME state directories.
# On mainline rather than stable: nginx-stable is pinned at 1.30.2 in Wolfi, which
# is affected by CVE-2026-42055 (heap overflow, CVSS 4.0 9.2) and CVE-2026-48142.
# Upstream fixed those in 1.30.3 / 1.31.2; Wolfi has only shipped the fix on the
# mainline line so far. Move back to nginx-stable once it ships >= 1.30.3.
# Do not hold your breath: nginx-stable has not been rebuilt in Wolfi since
# 2026-05-26, and Wolfi's advisory data names a fixed version (1.30.4-r2) that has
# never been published to the public repo, so this may be permanent.
# Keeps busybox + gettext: the entrypoint (runtime envsubst templating) is a
# /bin/sh script shipped via the nginx-entrypoint melange package.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - busybox
    - gettext
    - nginx-mainline
    - nginx-acme-entrypoint
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nginx
      gid: 65532
  users:
    - username: nginx
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/local/bin/docker-entrypoint.sh

environment:
  PATH: /usr/sbin:/usr/bin:/bin

paths:
  # The entrypoint renders templates into here at boot, so it must be writable
  # by the run-as user. /etc/nginx/templates (read-only) is shipped by the package.
  - path: /etc/nginx/conf.d
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/client_body_temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/proxy_temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/fastcgi_temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/uwsgi_temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/nginx/scgi_temp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/log/nginx
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /run/nginx
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  # ACME state (TLS_MODE=acme): lego's account key, the certificate pair and its
  # archive of superseded ones. Mount a volume here to keep them across a
  # recreate — without one, every restart is a fresh issuance and Let's Encrypt
  # allows five duplicates a week.
  #
  # These MUST exist in the image, owned by the run-as user. A named volume whose
  # mount point is absent from the image is created root-owned, and this container
  # is not root: lego would fail its first write, and the failure reads as a
  # permission error on a directory the container appears to own.
  - path: /var/lib/acme
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o700
  - path: /var/lib/acme/webroot
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/acme/webroot/.well-known
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/lib/acme/webroot/.well-known/acme-challenge
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: nginx-acme
  org.opencontainers.image.description: Hardened nginx on Wolfi that obtains and renews its own TLS certificate (lego)
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: BSD-2-Clause

archs:
  - x86_64
