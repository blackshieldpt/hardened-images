# Builds mailpit from source (instead of repackaging the upstream release binary),
# so the bundled Go dependencies are current — golang.org/x/crypto, x/net, x/text
# and x/image are bumped past the GO-2026 advisories shipped in the release binary.
# Pure-Go (CGO disabled); the Vue UI is built with esbuild via npm
# and embedded (server/embed.go: //go:embed ui -> server/ui/dist).
package:
  name: mailpit-hardened
  version: 1.30.7
  epoch: 0
  description: "Mailpit SMTP testing server (built from source, patched deps)"
  copyright:
    - license: MIT

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go
      - nodejs
      - npm
      - git

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/axllent/mailpit
      tag: v${{package.version}}
      expected-commit: a99ad9018d1a2779ace0a8509f6b2683b87e93c9
  - name: Build the embedded web UI
    runs: |
      npm ci
      npm run package
  - name: Bump vulnerable Go dependencies
    runs: |
      go get golang.org/x/crypto@v0.52.0 golang.org/x/net@v0.55.0 \
        golang.org/x/text@v0.39.0 golang.org/x/image@v0.43.0
      go mod tidy
  - name: Compile static binary
    runs: |
      CGO_ENABLED=0 go build \
        -ldflags "-s -w -X github.com/axllent/mailpit/config.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/mailpit" .
  - runs: |
      "${{targets.destdir}}/usr/bin/mailpit" version

update:
  enabled: true
  github:
    identifier: axllent/mailpit
    use-tag: true
    tag-filter: "v"
    strip-prefix: "v"
