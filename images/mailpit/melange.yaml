# Builds mailpit from source (instead of repackaging the upstream release binary),
# so the bundled Go dependencies are whatever upstream's go.mod pins rather than
# whatever was current when the release binary was cut. v1.31.0 carries x/crypto
# v0.55.0, x/net v0.58.0, x/text v0.41.0 and x/image v0.45.0, all past the GO-2026
# advisories, so no overrides are needed here.
# Pure-Go (CGO disabled); the Vue UI is built with esbuild via npm
# and embedded (server/embed.go: //go:embed ui -> server/ui/dist).
package:
  name: mailpit-hardened
  version: 1.31.0
  epoch: 0
  description: "Mailpit SMTP testing server (built from source, patched deps)"
  copyright:
    - license: MIT

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - go
      - nodejs
      - npm
      - git

pipeline:
  - uses: git-checkout
    with:
      repository: https://github.com/axllent/mailpit
      tag: v${{package.version}}
      expected-commit: 311fe2c532627c60562bd36499e8ad0584ae7e6f
  - name: Build the embedded web UI
    runs: |
      npm ci
      npm run package
  - name: Compile static binary
    runs: |
      CGO_ENABLED=0 go build \
        -ldflags "-s -w -X github.com/axllent/mailpit/config.Version=v${{package.version}}" \
        -o "${{targets.destdir}}/usr/bin/mailpit" .
  - runs: |
      "${{targets.destdir}}/usr/bin/mailpit" version

update:
  enabled: true
  github:
    identifier: axllent/mailpit
    use-tag: true
    tag-filter: "v"
    strip-prefix: "v"
