# Hardened Mailpit (apko) — upstream static binary repackaged via melange, shell-less, non-root.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - mailpit-hardened
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: mailpit
      gid: 65532
  users:
    - username: mailpit
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/mailpit

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /tmp
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o1777

annotations:
  org.opencontainers.image.title: mailpit
  org.opencontainers.image.description: Hardened shell-less Mailpit SMTP testing server
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: MIT

archs:
  - x86_64
