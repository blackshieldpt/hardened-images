# Hardened Kafka (apko) — Wolfi kafka-4.3 (KRaft mode), bash + openjdk-17 (auto-dep).
# Keeps bash: the Kafka start/storage scripts and the bootstrap entrypoint are shell scripts.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - bash
    - busybox
    - kafka-4.3
    - kafka-config
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: kafka
      gid: 65532
  users:
    - username: kafka
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/kafka-entrypoint.sh

environment:
  PATH: /usr/lib/kafka/bin:/usr/bin:/bin
  JAVA_HOME: /usr/lib/jvm/default-jvm
  LOG_DIR: /var/kafka/logs
  KAFKA_DATA_DIR: /var/kafka/data

paths:
  - path: /var/kafka
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/kafka/data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /var/kafka/logs
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: kafka
  org.opencontainers.image.description: Hardened Apache Kafka (KRaft) on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: Apache-2.0

archs:
  - x86_64
