# Repackages the upstream Apache Kafka binary distribution (KRaft), replacing
# Wolfi's kafka-4.3 package, and ships the hardened server.properties +
# entrypoint. server.properties/entrypoint.sh are read from images/kafka via
# --source-dir.
#
# Wolfi's kafka-4.3 stopped being rebuilt on 2026-06-02 at 4.3.0-r1. It was not
# missing a newer Kafka -- it was missing newer *jars*: every finding in this
# image (7 High, 14 Medium) was a bundled library under libs/, none in Kafka's
# own code, and all with published fixes the frozen package will never ship. The
# whole Kafka/ZooKeeper family in public Wolfi stops on that date, so there was
# no line to move to either. Being apk-based also hid a version bump: the pin
# named the Wolfi *line* (4.3), so 4.3.1 never registered as drift.
#
# Because nothing was wrong with Kafka itself, this repackages the upstream
# tarball rather than building from source -- a Gradle/Scala build would produce
# the same vulnerable jars, since upstream's own dependencies.gradle pins
# jackson 2.21.2, jetty 12.0.34 and jline 3.30.4 at both 4.3.0 and 4.3.1. The
# two pipeline steps below are the actual fix.
package:
  name: kafka-hardened
  version: 4.3.1
  epoch: 0
  description: "Apache Kafka (KRaft, upstream distribution repackaged with patched jars) + hardened config"
  copyright:
    - license: Apache-2.0

vars:
  scala: "2.13"
  # sha256 of kafka_2.13-4.3.1.tgz, cross-checked against the SHA-512 Apache
  # publishes next to it (downloads.apache.org/kafka/4.3.1/...tgz.sha512).
  sha256: f118328b2d053497350d5befd82c08db7ffd710327ff52943dd5caaa1b25db21

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl

pipeline:
  - name: Unpack the upstream distribution
    runs: |
      curl -fsSL --retry 5 --retry-all-errors \
        "https://archive.apache.org/dist/kafka/${{package.version}}/kafka_${{vars.scala}}-${{package.version}}.tgz" \
        -o kafka.tgz
      echo "${{vars.sha256}}  kafka.tgz" | sha256sum -c -
      tar xzf kafka.tgz
      src="kafka_${{vars.scala}}-${{package.version}}"
      dest="${{targets.destdir}}/usr/lib/kafka"
      install -d "$dest"
      cp -a "$src/bin" "$src/libs" "$src/config" "$dest/"
      # The distribution carries Windows launchers; the Wolfi package pruned them
      # and so do we, rather than ship 30-odd .bat files that cannot run here.
      rm -rf "$dest/bin/windows"

  - name: Drop Connect — this image is a broker, and Connect is what pulls Jetty
    runs: |
      # jetty-*, jersey-*, swagger-annotations and connect-* exist for the Kafka
      # Connect REST runtime. The entrypoint starts kafka-server-start.sh and
      # nothing else; a broker never loads them. Removing them clears all three
      # jetty findings outright (GHSA-2fvj-hgj9-j2gr High, plus two Mediums)
      # instead of chasing patch versions of a stack this image does not run.
      #
      # Consequence for consumers, documented in the image README: this image
      # cannot run connect-distributed.sh or connect-standalone.sh. It could not
      # usefully do so before either -- Connect wants its own config, its own
      # ports and its own lifecycle -- but it would previously have started.
      lib="${{targets.destdir}}/usr/lib/kafka/libs"
      # Checked before and after: `rm -f <glob>` followed by a check for the same
      # glob can only pass, so the failure worth catching is upstream renaming the
      # artifacts, which would make the rm a silent no-match.
      before="$(ls "$lib" | grep -cE '^(connect-|jetty-|jersey-|swagger-)' || true)"
      [ "$before" -ge 20 ] || { echo "expected >=20 Connect/Jetty/Jersey jars, found ${before} — did upstream restructure libs/?" >&2; exit 1; }
      rm -f "$lib"/connect-*.jar "$lib"/jetty-*.jar "$lib"/jersey-*.jar "$lib"/swagger-annotations-*.jar
      after="$(ls "$lib" | grep -cE '^(connect-|jetty-|jersey-|swagger-)' || true)"
      [ "$after" -eq 0 ] || { echo "Connect/Jetty/Jersey jars survived removal:" >&2; ls "$lib" | grep -E '^(connect-|jetty-|jersey-|swagger-)' >&2; exit 1; }
      # The Connect launchers are dead without their jars. Leaving them would let
      # someone start a process that fails on NoClassDefFoundError at runtime
      # instead of not being there.
      rm -f "${{targets.destdir}}"/usr/lib/kafka/bin/connect-*.sh

  - name: Replace the jars upstream pins at a vulnerable version
    runs: |
      # Each line is <group> <artifact> <old> <new> <sha256-of-new>. The old
      # version is named so the build fails when upstream moves on and the swap
      # would silently be a DOWNGRADE -- the one failure mode a patched-jar image
      # cannot detect by scanning, since the scan would simply look clean.
      #
      # jackson-annotations is deliberately absent: it tracks the minor line only
      # (2.21, no patch releases exist) and carries no findings.
      # lz4-java is at.yawk.lz4, not org.lz4 -- Kafka bundles the maintained fork,
      # and org.lz4 stops at 1.8.1, so the obvious coordinate is the wrong one.
      lib="${{targets.destdir}}/usr/lib/kafka/libs"
      while read -r group artifact old new sum; do
          [ -n "$group" ] || continue
          test -f "${lib}/${artifact}-${old}.jar" || {
              echo "expected ${artifact}-${old}.jar in the distribution; upstream has moved — recheck the advisory before bumping" >&2
              exit 1
          }
          curl -fsSL --retry 5 --retry-all-errors \
            "https://repo1.maven.org/maven2/$(echo "$group" | tr . /)/${artifact}/${new}/${artifact}-${new}.jar" \
            -o "${lib}/${artifact}-${new}.jar"
          echo "${sum}  ${lib}/${artifact}-${new}.jar" | sha256sum -c -
          rm -f "${lib}/${artifact}-${old}.jar"
      done <<'EOF'
      com.fasterxml.jackson.core jackson-core 2.21.2 2.21.5 b64b5874162b503a0e58a8f7758266e8dd9f91bf49e3a59ae0b5f47589a231b7
      com.fasterxml.jackson.core jackson-databind 2.21.2 2.21.5 507418c0fafd38b2b2cfb704521630da613a8e4cc8381195a6f418017883e2c0
      com.fasterxml.jackson.dataformat jackson-dataformat-csv 2.21.2 2.21.5 b278bd22805093e1b3e31c9ad7fa2773d3ac9e250da8cb566bd914334cc51a96
      com.fasterxml.jackson.dataformat jackson-dataformat-yaml 2.21.2 2.21.5 c26143ac5503fd545bd5e9063f45a2499be89971559875e47cc868ef9359d10b
      com.fasterxml.jackson.datatype jackson-datatype-jdk8 2.21.2 2.21.5 c8b1a0d14ffb3f8f8a1f182856c8803a3ee1d7c1aeb68dfee08f22d934ce108f
      com.fasterxml.jackson.jakarta.rs jackson-jakarta-rs-base 2.21.2 2.21.5 07f11f2e46153b3e8d27bf6ff8f874b31bf781bf46bef69434355623a67cac5d
      com.fasterxml.jackson.jakarta.rs jackson-jakarta-rs-json-provider 2.21.2 2.21.5 c176333dd1edb820698fd3376e6f376919e3b6a208b37d112ce32192e9e787d6
      com.fasterxml.jackson.module jackson-module-blackbird 2.21.2 2.21.5 6e1aac3aed140a3defec385083bba339d52eebb3f940582f03f64ad43ef3c433
      com.fasterxml.jackson.module jackson-module-jakarta-xmlbind-annotations 2.21.2 2.21.5 5cb2cc2bf59faccf412ed6cba8588724b23c6145e5bda8d5ebee26db6d4dd12a
      org.jline jline 3.30.4 3.30.14 15731604f27ce9045eeb977f9760d766ffa1a53734b9adb31a6e493ec76bc3a2
      org.apache.logging.log4j log4j-1.2-api 2.25.4 2.25.5 4dd812dc5a6343f542a9e0046b1ec78ecf10bdd5a8c15745101cdd8b9aa24974
      org.apache.logging.log4j log4j-api 2.25.4 2.25.5 64777f73ea0b3104c04eb82befbdccc30a425a19e83ad06cb2f93aa303511863
      org.apache.logging.log4j log4j-core 2.25.4 2.25.5 050c4f85deb48b055e9c041ac39043fbb79ce477841a11a1eb2969c86c6a0072
      org.apache.logging.log4j log4j-slf4j-impl 2.25.4 2.25.5 3d25b926bc6025c47ec010459749c12aa66b9d5537ba1922d67d89a098a66607
      at.yawk.lz4 lz4-java 1.10.2 1.11.1 e5e31b195fcc7e9c5da4b191af3b0082ee616c13f61cbd79409ffa65e4dd5c47
      EOF

  - name: Install the hardened config and entrypoint
    runs: |
      install -Dm0644 server.properties "${{targets.destdir}}/etc/kafka/server.properties"
      install -Dm0755 entrypoint.sh "${{targets.destdir}}/usr/bin/kafka-entrypoint.sh"

  - name: Verify what was built
    runs: |
      lib="${{targets.destdir}}/usr/lib/kafka/libs"
      test -f "$lib/kafka_${{vars.scala}}-${{package.version}}.jar"
      test -x "${{targets.destdir}}/usr/lib/kafka/bin/kafka-server-start.sh"
      test -x "${{targets.destdir}}/usr/lib/kafka/bin/kafka-storage.sh"
      # Every replaced jar, by exact name. test.sh asserts the same set against
      # the running image, so neither a bump nor a refactor can quietly restore a
      # vulnerable jar.
      for jar in jackson-core-2.21.5 jackson-databind-2.21.5 jline-3.30.14 \
                 log4j-core-2.25.5 log4j-api-2.25.5 lz4-java-1.11.1; do
          test -f "$lib/${jar}.jar" || { echo "MISSING: ${jar}.jar" >&2; exit 1; }
      done
      # Nothing from the replaced set may survive at its old version.
      stray="$(ls "$lib" | grep -E '^(jackson-(core|databind|dataformat|datatype|jakarta|module)[a-z-]*-2\.21\.2|jline-3\.30\.4|log4j-[a-z0-9.-]*-2\.25\.4|lz4-java-1\.10\.2)\.jar$' || true)"
      if [ -n "$stray" ]; then
          echo "ERROR: vulnerable jars survived replacement:" >&2
          echo "$stray" >&2
          exit 1
      fi

update:
  enabled: true
  github:
    identifier: apache/kafka
    use-tag: true
    # Kafka tags releases bare (4.3.1), with no prefix to strip.
    tag-filter: "4."
