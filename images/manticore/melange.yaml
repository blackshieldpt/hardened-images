# Repackages searchd/indexer + runtime data from the upstream Manticore bundle .deb.
# Only zlib/libstdc++/libgcc/glibc are needed at runtime (provided by Wolfi).
# manticore.conf is read from images/manticore via --source-dir.
package:
  name: manticore-hardened
  version: 28.4.4
  epoch: 0
  description: "Manticore Search daemon (upstream bundle deb repackaged)"
  copyright:
    - license: GPL-3.0-or-later

vars:
  deb: "manticore_28.4.4-26071006-f63d06ecb_amd64.deb"
  sha256: 719ee83dd8615765a88ceca3b7e74b365460d9881752183966b2f15508869edc

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox
      - ca-certificates-bundle
      - curl
      - binutils
      - libstdc++
      - libgcc
      - zlib

pipeline:
  - runs: |
      curl -fsSL --retry 5 --retry-all-errors \
        "https://repo.manticoresearch.com/repository/manticoresearch_jammy/dists/jammy/main/binary-amd64/${{vars.deb}}" \
        -o manticore.deb
      echo "${{vars.sha256}}  manticore.deb" | sha256sum -c -
      ar x manticore.deb
      tar xzf data.tar.gz
  - runs: |
      install -Dm0755 usr/bin/searchd "${{targets.destdir}}/usr/bin/searchd"
      install -Dm0755 usr/bin/indexer "${{targets.destdir}}/usr/bin/indexer"
      strip --strip-unneeded "${{targets.destdir}}/usr/bin/searchd" "${{targets.destdir}}/usr/bin/indexer"
      mkdir -p "${{targets.destdir}}/usr/share"
      cp -a usr/share/manticore "${{targets.destdir}}/usr/share/manticore"
      # Drop the bundled PHP tools (manticore-backup / -buddy / -load). They ship
      # their whole composer vendor/ trees, which carry known CVEs — including
      # CVE-2026-54133 (Critical) in mtdowling/jmespath.php — and they trip the scan
      # gate. Nothing here can run them: the image has no PHP interpreter (usr/bin is
      # searchd, indexer, ld.so, ldconfig) and manticore.conf sets no buddy_path, so
      # this removes unexecutable code, not functionality. Re-adding any of these
      # means also shipping an interpreter and tracking their composer deps.
      # Delete only these three directories — modules/ also holds the columnar,
      # secondary, knn and galera .so libraries, which searchd does load.
      rm -rf "${{targets.destdir}}/usr/share/manticore/modules/manticore-backup" \
             "${{targets.destdir}}/usr/share/manticore/modules/manticore-buddy" \
             "${{targets.destdir}}/usr/share/manticore/modules/manticore-load"
      # api/ is client-library source, not runtime data: libsphinxclient C sources,
      # a Ruby client with its specs, and sphinxapi.php. searchd never reads any of
      # it, and shipping other languages' client source in a server image is only
      # surface. Consumers get clients from their own package manager.
      rm -rf "${{targets.destdir}}/usr/share/manticore/api"
  - runs: |
      install -Dm0644 manticore.conf "${{targets.destdir}}/etc/manticoresearch/manticore.conf"
  - runs: |
      "${{targets.destdir}}/usr/bin/searchd" --help >/dev/null 2>&1 || true
      "${{targets.destdir}}/usr/bin/indexer" --help >/dev/null
      # No PHP anywhere in the package, and the .so modules must survive.
      # Written as an explicit if/exit rather than `! find ... | grep -q .`:
      # under set -e a command whose status is inverted with `!` is exempt from
      # triggering an exit, so that form silently passes whatever it finds.
      # Now covers the whole package: with api/ gone too, nothing upstream ships
      # legitimately carries .php, so any hit means a removal above went stale.
      if find "${{targets.destdir}}" -name '*.php' -print -quit | grep -q .; then
        echo "ERROR: unexpected .php in the package — a removal above needs updating" >&2
        exit 1
      fi
      for so in lib_manticore_columnar lib_manticore_secondary lib_manticore_knn libgalera_manticore; do
        test -f "${{targets.destdir}}/usr/share/manticore/modules/${so}.so"
      done

update:
  enabled: true
  github:
    identifier: manticoresoftware/manticoresearch
    use-tag: true
    tag-filter: "release-"
    strip-prefix: "release-"
