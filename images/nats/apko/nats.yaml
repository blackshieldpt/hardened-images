# Hardened NATS (apko) — Wolfi nats-server + hardened nats-config, shell-less, non-root.
contents:
  repositories:
    - https://packages.wolfi.dev/os
  keyring:
    - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
  packages:
    - wolfi-baselayout
    - nats-server
    - nats-config
    - ca-certificates-bundle

accounts:
  groups:
    - groupname: nats
      gid: 65532
  users:
    - username: nats
      uid: 65532
      gid: 65532
  run-as: 65532

entrypoint:
  command: /usr/bin/nats-server
cmd: --config /etc/nats/nats.conf

environment:
  PATH: /usr/bin:/bin

paths:
  - path: /data
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755
  - path: /data/jetstream
    type: directory
    uid: 65532
    gid: 65532
    permissions: 0o755

annotations:
  org.opencontainers.image.title: nats
  org.opencontainers.image.description: Hardened shell-less NATS Server (JetStream) on Wolfi
  org.opencontainers.image.vendor: Blackshield
  org.opencontainers.image.licenses: Apache-2.0

archs:
  - x86_64
