# Ships the hardened NATS JetStream config as an apk for apko to install.
# The nats-server binary comes from the Wolfi package (CVE-patched).
# nats.conf is read from images/nats via --source-dir.
package:
  name: nats-config
  version: "1.0.0"
  epoch: 0
  description: "Hardened NATS JetStream config"
  copyright:
    - license: Apache-2.0

environment:
  contents:
    repositories:
      - https://packages.wolfi.dev/os
    keyring:
      - https://packages.wolfi.dev/os/wolfi-signing.rsa.pub
    packages:
      - busybox

pipeline:
  - runs: |
      install -Dm0644 nats.conf "${{targets.destdir}}/etc/nats/nats.conf"
